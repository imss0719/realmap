<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14212E">
<title>단지 장부 - 리얼맵</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EEF1F4;--card:#fff;--fg:#14212E;--muted:#5E6A77;--line:#DCE2E8;--soft:#F5F7F9;--navy:#14212E;--gold:#F2B705;--sale:#1C64C8;--jeonse:#1F7A4D;--wolse:#D9480F;--presale:#6741B8;--done:#8A96A3;--accent:#0B6E69}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.pro{display:inline-block;background:var(--gold);color:var(--navy);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.top .navl{color:#fff;text-decoration:none;font-weight:700;font-size:15px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;white-space:nowrap}
.top .sp{flex:1}
.top .who{font-size:14px;opacity:.8}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 120px;display:grid;gap:14px}
.wrap>*,#cxBody>*{min-width:0}
#cxBody{display:grid;gap:14px;min-width:0}
.gate{max-width:520px;margin:12vh auto;background:var(--card);border-radius:20px;padding:32px 24px;text-align:center}
.gate h2{margin:0 0 8px;font-size:22px}.gate p{color:var(--muted);margin:0 0 20px}
.btn{border:0;border-radius:14px;min-height:48px;padding:0 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.main{background:var(--gold);color:var(--navy)}
.btn.sub{background:var(--card);border:2px solid var(--line)}
.btn.dark{background:var(--navy);color:#fff}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px;border-radius:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chips .add{border-style:dashed;color:var(--muted)}
.card{background:var(--card);border-radius:18px;padding:18px}
.card h2{font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-size:13px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted);font-size:15px}
.hd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hd .t{flex:1;min-width:220px}
.hd .t b{font-size:24px;letter-spacing:-.02em;display:block}
.hd .acts{display:flex;gap:6px;flex-wrap:wrap}
.places{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.places span{font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--muted)}
.empty{background:var(--card);border-radius:18px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:19px;margin-bottom:6px}
.find{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);font-size:17px}
.res{display:grid;gap:6px;margin-top:8px}
.res button{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px}
.res button b{display:block}.res button small{color:var(--muted)}
/* 시세판 */
.mtab{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.mtab th,.mtab td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.mtab th:first-child,.mtab td:first-child{text-align:left}
.mtab thead th{font-size:13px;color:var(--muted);font-weight:600}
.mtab td b{font-weight:700}
.mtab td small{display:block;font-size:12px;color:var(--muted)}
.jr-hi{color:#B42318;font-weight:700}.jr-mid{color:#9A6200;font-weight:700}
.scroll{overflow-x:auto}
.recent{display:grid;gap:6px;margin-top:10px}
.recent div{display:flex;gap:10px;align-items:baseline;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.recent .d{color:var(--muted);font-size:13px;min-width:78px;font-variant-numeric:tabular-nums}
.recent .k{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:1px 6px;flex:none;white-space:nowrap}
.recent .d{flex:none}
.recent .p{margin-left:auto;font-weight:700;white-space:nowrap;flex:none}
.k.s{background:var(--sale)}.k.j{background:var(--jeonse)}.k.w{background:var(--wolse)}
/* 동 탭 + 층×라인 표 */
.dongs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.dongs button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px}
.dongs button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.dongs button small{font-weight:600;opacity:.7;margin-left:3px;font-size:12px}
.grid{border-collapse:separate;border-spacing:4px;font-size:14px}
.grid th{font-size:12px;color:var(--muted);font-weight:600;padding:2px 4px;white-space:nowrap}
.grid th.fl{text-align:right;padding-right:6px;font-size:13px;color:var(--fg)}
.grid th.ln b{display:block;font-size:13px;color:var(--fg)}
.cell{min-width:64px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px;position:relative;padding:0 6px;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--navy)}
.cell.k-sale{background:var(--sale);border-color:var(--sale);color:#fff}
.cell.k-jeonse{background:var(--jeonse);border-color:var(--jeonse);color:#fff}
.cell.k-wolse{background:var(--wolse);border-color:var(--wolse);color:#fff}
.cell.k-presale{background:var(--presale);border-color:var(--presale);color:#fff}
.cell.k-done{background:#E3E8ED;border-color:#C9D1D9;color:var(--muted)}
.cell .memo{position:absolute;right:4px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #fff}
.cell .pr{display:block;font-size:11px;font-weight:600;opacity:.9;line-height:1}
.ftr{font-size:12px;color:var(--muted);white-space:nowrap;padding-left:6px;text-align:left}
.ftr span{display:inline-block;background:#FFF6D6;color:#7A5200;border-radius:6px;padding:1px 6px;margin:1px 3px 1px 0;font-weight:600}
.ftr span.j{background:#E9F6EF;color:#1F7A4D}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.lgd i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.loading{color:var(--muted);padding:14px 0}
/* 호 상세 시트 */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,18,26,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sbox{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding-bottom:20px}
@media (min-width:700px){.sheet{align-items:center}.sbox{border-radius:22px}}
.shd{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.shd b{font-size:20px;flex:1}
.shd button{background:none;border:0;color:#fff;font-size:30px;line-height:1;width:44px;height:44px}
.sb{padding:14px 16px;display:grid;gap:12px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info div{background:#fff;border-radius:12px;padding:10px 12px}
.info small{display:block;font-size:12px;color:var(--muted)}.info b{font-size:17px}
.mine{background:#fff;border-radius:14px;padding:12px 14px;border:2px solid var(--line);display:flex;align-items:center;gap:10px;text-decoration:none}
.mine .kd{color:#fff;font-weight:700;font-size:13px;padding:2px 9px;border-radius:8px}
.kd.sale{background:var(--sale)}.kd.jeonse{background:var(--jeonse)}.kd.wolse{background:var(--wolse)}.kd.presale{background:var(--presale)}
.mine em{margin-left:auto;font-style:normal;color:var(--sale);font-weight:700;font-size:14px}
textarea.in{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;resize:vertical}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.tl{display:grid;gap:4px}
.tl div{display:flex;gap:8px;font-size:15px;background:#fff;border-radius:10px;padding:8px 10px}
.tl div.same{outline:2px solid var(--gold)}
.tl .p{margin-left:auto;font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:80;max-width:90vw}
</style>
</head>
<body>
<div class="top">
  <a href="/" title="리얼맵 지도로" style="display:flex"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1C2D3D"/><g transform="translate(6.4 9) scale(0.72)" fill="#fff"><path d="M10 2H22V17.5L10 19Z"/><path d="M10 21 22 19.5V40L10 41.5Z"/><path d="M10 43.5 22 42V62H10Z"/><path d="M24 2H40.5L40 13H24Z"/><path d="M42.5 2H48L54 8V25L42.5 26.3Z"/><path d="M24 29.6 33 28.8V38H24Z"/><path d="M31 40.5H44L51.5 50 39.5 51.5Z"/><path d="M41 53.5 53 52 61 62H47Z"/><path d="M35 28.6 54 27V30L47 38H35Z" fill="#F2B705"/></g></svg></a>
  <h1>단지 장부 <span class="pro">PRO</span></h1>
  <a class="navl" href="/listings.html">매물장 ›</a>
  <span class="sp"></span>
  <span class="who" id="who"></span>
</div>
<div id="root"></div>
<div class="sheet" id="sheet" hidden>
  <div class="sbox" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="shd"><b id="shTitle">호 정보</b><button type="button" id="shClose" aria-label="닫기">×</button></div>
    <div class="sb" id="shBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="danji.js"></script>
</body>
</html>
