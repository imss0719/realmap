<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>회원 관리 · 리얼맵</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#EEF1F4;--surface:#fff;--fg:#16202A;--muted:#5E6A77;--line:#DCE2E8;--soft:#F5F7F9;--accent:#14212E;--ok:#1F7A3A;--warn:#B4231A}
@media (prefers-color-scheme: dark){:root{--bg:#0E1317;--surface:#151C22;--fg:#E5EAEF;--muted:#94A1AE;--line:#26313A;--soft:#1B242B;--accent:#F2B705;--ok:#6FD08C;--warn:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
header h1{font-size:20px;margin:0}
header a{margin-left:auto;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h2{margin:0 0 8px;font-size:17px}
.card p{margin:0 0 12px;color:var(--muted);line-height:1.6;font-size:14px}
input{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;width:min(320px,100%)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:#14212E;color:#fff;text-decoration:none}
.btn.kakao{background:#FEE500;color:#191919}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--warn);font-size:14px;margin-top:10px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;display:inline-block;margin:6px 0 12px;user-select:all}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:26px;letter-spacing:-.02em}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools label{font-size:13px;display:flex;gap:6px;align-items:center}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft)}
td.y{color:var(--ok);font-weight:700}
td.n{color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}
.sec-t{font-size:15px;font-weight:700;margin:26px 0 10px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px 8px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}
.bars div{flex:1;background:#F2B705;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.today{background:#14212E}
@media (prefers-color-scheme: dark){.bars div.today{background:#fff}}
.bars.dark div{background:#14212E}
@media (prefers-color-scheme: dark){.bars.dark div{background:#94A1AE}}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:10px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
@media (max-width:600px){.stats{grid-template-columns:1fr 1fr !important}}
</style>
</head>
<body>
<main>
  <header><img src="/favicon.svg" width="28" height="28" alt=""><h1>회원 관리</h1><a href="/">리얼맵으로</a></header>
  <div id="app"><div class="card"><p>확인 중입니다…</p></div></div>
</main>
<script>
(function () {
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dt = s => s ? new Date(s).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
  let pw = ''; try { pw = sessionStorage.getItem('rm.adm') || ''; } catch (e) { /* 무시 */ }
  let data = null, onlyMk = false, ZN = null;

  fetch('/api/auth?action=me').then(r => r.json()).then(me => {
    if (!me.member) return login();
    pw ? load() : askPw();
  }).catch(() => { app.innerHTML = '<div class="card"><p>상태를 확인하지 못했습니다. 잠시 후 새로고침해 주세요.</p></div>'; });

  function login() {
    app.innerHTML = `<div class="card"><h2>운영자 로그인</h2><p>운영자 카카오 계정으로 로그인해 주세요.</p><a class="btn kakao" href="/auth/login?r=${encodeURIComponent('/members.html')}">카카오로 로그인</a></div>`;
  }
  function askPw(msg) {
    app.innerHTML = `<div class="card"><h2>관리자 비밀번호</h2><p>Vercel에 넣어 둔 ADMIN_PASSWORD를 입력해 주세요. 이 창을 닫으면 다시 물어봅니다.</p>
      <form class="row" id="f"><input type="password" id="pw" autocomplete="current-password" placeholder="관리자 비밀번호" required><button class="btn" type="submit">확인</button></form>${msg ? `<p class="err">${esc(msg)}</p>` : ''}</div>`;
    document.getElementById('f').onsubmit = e => { e.preventDefault(); pw = document.getElementById('pw').value; try { sessionStorage.setItem('rm.adm', pw); } catch (x) { /* 무시 */ } load(); };
    document.getElementById('pw').focus();
  }
  async function load() {
    app.innerHTML = '<div class="card"><p>회원 목록을 불러오는 중입니다…</p></div>';
    let j;
    let st = 0, txt = '';
    try { const r = await fetch('/api/members', { headers: { 'x-admin-key': pw } }); st = r.status; txt = await r.text(); j = JSON.parse(txt); }
    catch (e) {
      const why = st === 404 ? 'api 폴더에 members.js 파일이 없습니다. GitHub의 api 폴더에 members.js가 올라갔는지 확인해 주세요.'
        : st >= 500 ? 'api 폴더의 auth.js가 예전 파일일 가능성이 큽니다. 이번에 보낸 auth.js를 api 폴더에 다시 올려 주세요.'
        : '서버에 연결하지 못했습니다.';
      app.innerHTML = `<div class="card"><h2>열 수 없습니다</h2><p>${esc(why)}</p><p style="font-size:12px">응답 코드 ${st || '-'} · ${esc(txt.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 160))}</p></div>`;
      return;
    }
    if (j.error === 'setup') {
      app.innerHTML = `<div class="card"><h2>처음 한 번만 설정해 주세요</h2>
        <p>지금 로그인한 카카오 계정의 회원번호입니다. 이 계정이 운영자(선배) 계정이 맞다면 아래 번호를 복사해서 Vercel 환경변수에 넣어 주세요.</p>
        <div class="code">${esc(j.myId)}</div>
        <p>Vercel → Settings → Environment Variables → 이름 <b>ADMIN_KAKAO_ID</b>, 값에 위 번호 → 저장 → Deployments에서 Redeploy</p></div>`;
      return;
    }
    if (j.error === 'login') return login();
    if (j.error === 'password') { try { sessionStorage.removeItem('rm.adm'); } catch (e) { /* 무시 */ } return askPw('비밀번호가 맞지 않습니다.'); }
    if (!j.ok) { app.innerHTML = `<div class="card"><h2>열 수 없습니다</h2><p>${esc(j.message || '오류가 발생했습니다.')}</p></div>`; return; }
    data = j; draw();
    // 정비사업 이름표 (페이지 순위·관심 구역에 이름 붙이기)
    if (!ZN) fetch('/data/seoul-zones.json').then(r => r.json()).then(z => { ZN = {}; (z.rows || []).forEach(x => { ZN[x.id] = x; }); draw(); }).catch(() => {});
  }
  const kday = s => s ? new Date(new Date(s).getTime() + 9 * 3600e3).toISOString().slice(0, 10).replace(/-/g, '') : '';
const GUN = { jongno: '종로구', jung: '중구', yongsan: '용산구', seongdong: '성동구', gwangjin: '광진구', dongdaemun: '동대문구', jungnang: '중랑구', seongbuk: '성북구', gangbuk: '강북구', dobong: '도봉구', nowon: '노원구', eunpyeong: '은평구', seodaemun: '서대문구', mapo: '마포구', yangcheon: '양천구', gangseo: '강서구', guro: '구로구', geumcheon: '금천구', yeongdeungpo: '영등포구', dongjak: '동작구', gwanak: '관악구', seocho: '서초구', gangnam: '강남구', songpa: '송파구', gangdong: '강동구' };
const pgName = k => { if (k === 'idx') return '서울 전체 현황판'; const [g, id] = k.split('/'); if (!id) return `${GUN[g] || g} 목록`; const z = ZN && ZN[id]; return z ? `${z.n} <small style="color:#5E6A77">${esc(z.gu)} · ${esc(z.st || '')}</small>` : `${GUN[g] || g} 구역 ${id}`; };
const bars = (vals, cls) => { const mx = Math.max(1, ...vals.map(x => x.v)); return `<div class="bars ${cls || ''}">${vals.map((x, i) => `<div class="${i === vals.length - 1 ? 'today' : ''}" style="height:${Math.max(2, x.v / mx * 100)}%" title="${x.t} · ${x.v}"></div>`).join('')}</div>`; };
function csv(name, head, rows) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const blob = new Blob(['﻿' + [head.map(q).join(',')].concat(rows.map(r => r.map(q).join(','))).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${name}_${new Date().toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function extra() {
  const st = data.stats; if (!st) return '';
  const D = [...st.days].reverse();
  // ① 가입 추이
  const join = {}; data.rows.forEach(r => { const d = kday(r.joined); if (d) join[d] = (join[d] || 0) + 1; });
  const j30 = st.days.reduce((a, x) => a + (join[x.d] || 0), 0), j7 = st.days.slice(0, 7).reduce((a, x) => a + (join[x.d] || 0), 0);
  const rate = st.uv30 ? (j30 / st.uv30 * 100) : 0;
  let h = `<div class="sec-t" style="margin-top:18px">가입 추이 <small style="font-weight:400;color:#5E6A77">영상·블로그 올린 날 효과 보기</small></div>
  <div class="stats" style="grid-template-columns:repeat(4,1fr)">
  <div class="stat"><span>오늘 가입</span><b>${join[st.days[0].d] || 0}</b></div><div class="stat"><span>최근 7일 가입</span><b>${j7}</b></div>
  <div class="stat"><span>최근 30일 가입</span><b>${j30}</b></div><div class="stat"><span>가입 전환율 (30일)</span><b>${rate.toFixed(1)}%</b></div></div>
  <div class="chart">${bars(D.map(x => ({ v: join[x.d] || 0, t: `${x.d.slice(4, 6)}.${x.d.slice(6)}` })), 'dark')}<div class="axis"><span>${st.days[29].d.slice(4, 6)}.${st.days[29].d.slice(6)}</span><span>일별 가입자 · 전환율 = 30일 가입 ÷ 30일 방문자</span><span>오늘</span></div></div>`;
  // ② 정비사업 페이지
  const sum = (n, key) => { const m = {}; st.days.slice(0, n).forEach(x => Object.entries(x[key] || {}).forEach(([k, v]) => { m[k] = (m[k] || 0) + v; })); return m; };
  const spv30 = st.days.reduce((a, x) => a + (x.spv || 0), 0), toMap = st.days.reduce((a, x) => a + ((x.src || {}).seoul || 0), 0);
  const pg30 = sum(30, 'spg'), pg7 = sum(7, 'spg'), ss30 = sum(30, 'ssrc');
  const top = Object.keys(pg30).sort((a, b) => pg30[b] - pg30[a]).slice(0, 15);
  const L = { blog: '네이버 블로그', nsearch: '네이버 검색', naver: '네이버 (기타·앱)', insta: '인스타그램', kakao: '카카오톡', youtube: '유튜브', google: '구글', daum: '다음', direct: '직접 입력 · 리얼맵 안에서', etc: '기타 사이트' };
  const sk = Object.keys(ss30).sort((a, b) => ss30[b] - ss30[a]), stot = sk.reduce((a, k) => a + ss30[k], 0) || 1;
  h += `<div class="sec-t" style="margin-top:22px">정비사업 페이지 <small style="font-weight:400;color:#5E6A77">realmap.online/seoul/ · 검색 노출 효과 보기</small></div>
  <div class="stats" style="grid-template-columns:repeat(4,1fr)">
  <div class="stat"><span>오늘 방문자</span><b>${(st.days[0].suv || 0).toLocaleString()}</b></div><div class="stat"><span>최근 7일 방문자</span><b>${(st.suv7 || 0).toLocaleString()}</b></div>
  <div class="stat"><span>30일 페이지 열람</span><b>${spv30.toLocaleString()}</b></div><div class="stat"><span>30일 지도로 넘어옴</span><b>${toMap.toLocaleString()}</b></div></div>
  <div class="chart">${bars(D.map(x => ({ v: x.suv || 0, t: `${x.d.slice(4, 6)}.${x.d.slice(6)}` })))}<div class="axis"><span>${st.days[29].d.slice(4, 6)}.${st.days[29].d.slice(6)}</span><span>정비사업 페이지 일별 방문자</span><span>오늘</span></div></div>
  <div class="two">
  <div class="tbl"><table><thead><tr><th>많이 본 페이지</th><th>7일</th><th>30일</th></tr></thead><tbody>
  ${top.length ? top.map(k => `<tr><td>${pgName(k)}</td><td>${pg7[k] || 0}</td><td>${pg30[k]}</td></tr>`).join('') : '<tr><td colspan="3" class="n">아직 방문 기록이 없습니다</td></tr>'}</tbody></table></div>
  <div class="tbl"><table><thead><tr><th>들어온 경로 (30일)</th><th>횟수</th><th>비중</th></tr></thead><tbody>
  ${sk.length ? sk.map(k => `<tr><td>${L[k] || k}</td><td>${ss30[k]}</td><td>${Math.round(ss30[k] / stot * 100)}%</td></tr>`).join('') : '<tr><td colspan="3" class="n">아직 기록이 없습니다</td></tr>'}</tbody></table></div></div>
  <p class="note">· '네이버 검색'·'구글'이 늘면 검색 노출이 효과를 내고 있다는 뜻입니다. '지도로 넘어옴'은 정비사업 페이지에서 리얼맵 지도로 들어온 방문 수입니다. 오늘(10/22)부터 셉니다.</p>`;
  // ③ 관심 구역 · 추진 알림
  const z = data.zsum || {}, zr = data.zrank || [], al = data.alerts || [];
  h += `<div class="sec-t" style="margin-top:22px">관심 구역 · 추진 알림 <small style="font-weight:400;color:#5E6A77">어느 구역에 관심이 많은지</small></div>
  <div class="stats" style="grid-template-columns:repeat(3,1fr)">
  <div class="stat"><span>관심 구역 담은 회원</span><b>${z.members || 0}</b></div><div class="stat"><span>추진 알림 신청 회원</span><b>${z.alertMembers || 0}</b></div><div class="stat"><span>담긴 구역 (중복 제외)</span><b>${z.zones || 0}</b></div></div>
  <div class="tbl"><table><thead><tr><th>인기 관심 구역</th><th>구</th><th>추진 단계</th><th>담은 회원</th><th>알림 신청</th></tr></thead><tbody>
  ${zr.length ? zr.map(x => { const n = ZN && ZN[x.id]; return `<tr><td>${esc(x.n)}</td><td>${esc(x.gu)}</td><td>${esc((n && n.st) || x.st || '-')}</td><td>${x.cnt}</td><td>${x.alert || '-'}</td></tr>`; }).join('') : '<tr><td colspan="5" class="n">아직 담긴 구역이 없습니다</td></tr>'}</tbody></table></div>
  <div class="tools" style="margin-top:12px"><b style="font-size:14px">추진 알림 신청자 ${al.length}건</b><button class="btn ghost" type="button" id="alCsv">엑셀(CSV) 내려받기</button></div>
  <div class="tbl" style="max-height:320px"><table><thead><tr><th>닉네임</th><th>알림 이메일</th><th>구역</th><th>구</th><th>신청 당시 단계</th><th>담은 날</th></tr></thead><tbody>
  ${al.length ? al.map(x => `<tr><td>${esc(x.nickname || '-')}</td><td>${esc(x.email)}</td><td>${esc(x.zone)}</td><td>${esc(x.gu)}</td><td>${esc(x.st || '-')}</td><td>${dt(x.at)}</td></tr>`).join('') : '<tr><td colspan="6" class="n">아직 신청자가 없습니다</td></tr>'}</tbody></table></div>
  <p class="note">· 알림 이메일은 회원이 '추진 알림'을 신청하면서 직접 확인·동의한 주소입니다. 단계 변경 알림 외의 광고 메일에는 쓰지 마세요.</p>`;
  return h;
}
function draw() {
    const rows = data.rows.filter(r => !onlyMk || r.marketing);
    const week = Date.now() - 7 * 864e5;
    const recent = data.rows.filter(r => r.joined && new Date(r.joined).getTime() > week).length;
    const st = data.stats, T = st && st.days[0];
    const visit = st ? `<div class="sec-t">방문 통계</div>
      <div class="stats" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat"><span>오늘 방문자</span><b>${T.uv.toLocaleString()}</b></div>
        <div class="stat"><span>최근 7일 방문자</span><b>${st.uv7.toLocaleString()}</b></div>
        <div class="stat"><span>최근 30일 방문자</span><b>${st.uv30.toLocaleString()}</b></div>
        <div class="stat"><span>오늘 필지 조회</span><b>${T.pcl.toLocaleString()}</b></div>
      </div>
      <div class="chart"><div class="bars">${(() => { const ds = [...st.days].reverse(), mx = Math.max(1, ...ds.map(x => x.uv)); return ds.map((x, i) => `<div class="${i === ds.length - 1 ? 'today' : ''}" style="height:${Math.max(2, x.uv / mx * 100)}%" title="${x.d.slice(4, 6)}.${x.d.slice(6)} · 방문자 ${x.uv} · 페이지 ${x.pv} · 필지 조회 ${x.pcl}"></div>`).join(''); })()}</div>
        <div class="axis"><span>${st.days[29].d.slice(4, 6)}.${st.days[29].d.slice(6)}</span><span>최근 30일 일별 방문자 (막대를 누르거나 올리면 숫자)</span><span>오늘</span></div></div>
      <div class="tbl" style="margin-top:10px;max-height:260px"><table><thead><tr><th>날짜</th><th>방문자</th><th>페이지 열람</th><th>필지 조회</th><th>로그인 회원</th></tr></thead><tbody>
        ${st.days.slice(0, 14).map(x => `<tr><td>${x.d.slice(0, 4)}.${x.d.slice(4, 6)}.${x.d.slice(6)}</td><td>${x.uv.toLocaleString()}</td><td>${x.pv.toLocaleString()}</td><td>${x.pcl.toLocaleString()}</td><td>${x.mem.toLocaleString()}</td></tr>`).join('')}
      </tbody></table></div>
      ${(() => {
        const L = { blog: '네이버 블로그', nsearch: '네이버 검색', naver: '네이버 (기타·앱)', insta: '인스타그램', kakao: '카카오톡', youtube: '유튜브', google: '구글', daum: '다음', seoul: '정비사업 페이지에서', direct: '직접 입력 · 즐겨찾기', etc: '기타 사이트' };
        const sum = n => { const m = {}; st.days.slice(0, n).forEach(x => Object.entries(x.src || {}).forEach(([k, v]) => { m[k] = (m[k] || 0) + v; })); return m; };
        const d1 = sum(1), d7 = sum(7), d30 = sum(30);
        const keys = Object.keys(L).filter(k => d30[k]).sort((a, b) => (d30[b] || 0) - (d30[a] || 0));
        const tot = keys.reduce((a, k) => a + d30[k], 0);
        return `<div class="sec-t" style="margin-top:18px">유입 경로 <small style="font-weight:400;color:#5E6A77">방문 1회당 한 번 · 어디서 들어왔는지</small></div>
          <div class="tbl"><table><thead><tr><th>경로</th><th>오늘</th><th>최근 7일</th><th>최근 30일</th><th>비중 (30일)</th></tr></thead><tbody>
          ${keys.length ? keys.map(k => `<tr><td>${L[k]}</td><td>${(d1[k] || 0).toLocaleString()}</td><td>${(d7[k] || 0).toLocaleString()}</td><td>${d30[k].toLocaleString()}</td><td>${Math.round(d30[k] / tot * 100)}%</td></tr>`).join('') : '<tr><td colspan="5" class="n">아직 집계된 유입이 없습니다. 오늘부터 쌓입니다.</td></tr>'}
          </tbody></table></div>
          <p class="note">· 블로그·릴스·카톡에 주소를 올릴 때 <b>realmap.online/?from=blog</b> (또는 ?from=insta, ?from=kakao, ?from=youtube)처럼 붙이면 더 정확하게 구분됩니다.</p>`;
      })()}
      ${(() => {
        const GU = { '11110': '종로구', '11140': '중구', '11170': '용산구', '11200': '성동구', '11215': '광진구', '11230': '동대문구', '11260': '중랑구', '11290': '성북구', '11305': '강북구', '11320': '도봉구', '11350': '노원구', '11380': '은평구', '11410': '서대문구', '11440': '마포구', '11470': '양천구', '11500': '강서구', '11530': '구로구', '11545': '금천구', '11560': '영등포구', '11590': '동작구', '11620': '관악구', '11650': '서초구', '11680': '강남구', '11710': '송파구', '11740': '강동구', '41570': '김포시', '41281': '고양 덕양구', '41285': '고양 일산동구', '41287': '고양 일산서구', '28245': '인천 계양구', '28237': '인천 부평구' };
        const WARM = ['11440', '11410', '11380'];
        const sum = n => { const m = {}; st.days.slice(0, n).forEach(x => Object.entries(x.gu || {}).forEach(([k, v]) => { m[k] = (m[k] || 0) + v; })); return m; };
        const d1 = sum(1), d7 = sum(7), d30 = sum(30);
        const keys = Object.keys(d30).sort((a, b) => d30[b] - d30[a]).slice(0, 15);
        const tot = keys.reduce((a, k) => a + d30[k], 0) || 1;
        const pct = st.maxKeys ? Math.round(st.keys / st.maxKeys * 100) : 0;
        return `<div class="sec-t" style="margin-top:18px">지역별 필지 조회 <small style="font-weight:400;color:#5E6A77">어느 구를 많이 보는지 · 미리 불러오기 지역을 정할 때 참고</small></div>
          <div class="tbl"><table><thead><tr><th>지역</th><th>오늘</th><th>최근 7일</th><th>최근 30일</th><th>비중 (30일)</th></tr></thead><tbody>
          ${keys.length ? keys.map(k => `<tr><td>${GU[k] || (st.guNames && st.guNames[k]) || '지역 코드 ' + k}${WARM.includes(k) ? ' <small style="color:#1F7A3A;font-weight:700">미리 불러오는 중</small>' : ''}</td><td>${(d1[k] || 0).toLocaleString()}</td><td>${(d7[k] || 0).toLocaleString()}</td><td>${d30[k].toLocaleString()}</td><td>${Math.round(d30[k] / tot * 100)}%</td></tr>`).join('') : '<tr><td colspan="5" class="n">아직 집계된 조회가 없습니다. 오늘부터 쌓입니다.</td></tr>'}
          </tbody></table></div>
          <div class="sec-t" style="margin-top:18px">창고 사용량 <small style="font-weight:400;color:#5E6A77">빨리 보여 주려고 저장해 둔 공공데이터</small></div>
          <div class="stat" style="max-width:520px"><span>저장된 자료 ${st.keys.toLocaleString()}개 / 한도 ${st.maxKeys.toLocaleString()}개</span><b style="color:${pct >= 90 ? '#C03A16' : pct >= 70 ? '#9A6200' : 'inherit'}">${pct}%</b>
            <div style="height:10px;border-radius:5px;background:#E6EAEE;margin-top:8px;overflow:hidden"><div style="height:100%;width:${Math.min(100, pct)}%;background:${pct >= 90 ? '#E4572E' : pct >= 70 ? '#F2B705' : '#1F7A3A'}"></div></div></div>
          <p class="note">· 한도에 다다르면 새 자료를 더 저장하지 않아 처음 보는 필지가 느려질 수 있습니다. 70%를 넘으면 알려 주세요. 회원·매물장 자료는 이 한도와 상관없이 항상 저장됩니다.</p>`;
      })()}
      <p class="note">· 방문자는 같은 휴대폰·컴퓨터를 하루 한 명으로 셉니다 (브라우저를 바꾸거나 기록을 지우면 다시 셉니다). 운영자 본인 방문은 오늘부터 빠집니다 (운영자로 한 번이라도 로그인한 기기 포함).<br>· 검색엔진 로봇과 새벽 미리 불러오기는 세지 않습니다. 통계를 넣은 날부터 쌓입니다.</p>
      <div class="sec-t">회원</div>` : '';
    app.innerHTML = visit.replace('<div class="sec-t">회원</div>', '') + extra() + '<div class="sec-t">회원</div>' + `<div class="stats">
        <div class="stat"><span>전체 회원</span><b>${data.total}</b></div>
        <div class="stat"><span>소식 수신 동의</span><b>${data.marketing}</b></div>
        <div class="stat"><span>최근 7일 가입</span><b>${recent}</b></div>
      </div>
      <div class="tools"><label><input type="checkbox" id="mk" ${onlyMk ? 'checked' : ''} style="width:auto"> 수신 동의 회원만</label>
        <button class="btn ghost" type="button" id="csv">엑셀(CSV) 내려받기</button>
        <button class="btn ghost" type="button" id="re">새로고침</button></div>
      <div class="tbl"><table><thead><tr><th>닉네임</th><th>이메일</th><th>가입일</th><th>최근 로그인</th><th>소식 수신</th><th>동의 일시</th><th>관심 부동산</th><th>관심 구역</th><th>추진 알림</th></tr></thead><tbody>
      ${rows.length ? rows.map(r => `<tr><td>${esc(r.nickname || '-')}</td><td>${esc(r.email || '-')}</td><td>${dt(r.joined)}</td><td>${dt(r.last)}</td><td class="${r.marketing ? 'y' : 'n'}">${r.marketing ? '동의' : '미동의'}</td><td>${r.marketing ? dt(r.marketingAt) : '-'}</td><td>${r.favs || '-'}</td><td>${r.zones || '-'}</td><td class="${r.zalerts ? 'y' : 'n'}">${r.zalerts ? r.zalerts + '곳' : '-'}</td></tr>`).join('') : '<tr><td colspan="9" class="n">회원이 없습니다</td></tr>'}
      </tbody></table></div>
      <p class="note">· 이 화면과 내려받은 파일에는 개인정보가 들어 있습니다. 다른 사람과 공유하지 마시고, 쓰고 난 파일은 지워 주세요.<br>
      · 소식을 보낼 때는 '소식 수신: 동의' 회원에게만, 제목에 (광고) 표시와 수신거부 방법을 넣어 보내야 합니다. 동의일로부터 2년마다 수신 동의를 다시 확인해야 합니다.</p>`;
    document.getElementById('mk').onchange = e => { onlyMk = e.target.checked; draw(); };
    document.getElementById('re').onclick = load;
    const ac = document.getElementById('alCsv'); if (ac) ac.onclick = () => csv('리얼맵_추진알림신청자', ['닉네임', '알림 이메일', '구역', '구', '신청 당시 단계', '담은 날', '이메일 동의일'], (data.alerts || []).map(x => [x.nickname, x.email, x.zone, x.gu, x.st, dt(x.at), dt(x.emailAt)]));
    document.getElementById('csv').onclick = () => {
      const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lines = [['닉네임', '이메일', '가입일', '최근 로그인', '소식 수신', '동의 일시', '관심 부동산', '관심 구역', '추진 알림'].map(q).join(',')]
        .concat(rows.map(r => [r.nickname, r.email, dt(r.joined), dt(r.last), r.marketing ? '동의' : '미동의', r.marketing ? dt(r.marketingAt) : '', r.favs || 0, r.zones || 0, r.zalerts || 0].map(q).join(',')));
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `리얼맵_회원_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
  }
})();
