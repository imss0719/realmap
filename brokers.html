<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>리얼맵 운영</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 10/27 운영자 화면 하나로: 중개사 관리 + 회원 관리(방문·가입 · 일반 회원 · 정비사업 알림) · 촘촘하게 */
:root{--bg:#EEF1F4;--surface:#fff;--fg:#14212E;--muted:#5E6A77;--line:#DCE2E8;--soft:#F5F7F9;--gold:#F2B705;--ok:#1F7A3A;--warn:#C92A2A;--navy:#14212E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;letter-spacing:-.01em;word-break:keep-all}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;height:46px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:4px;padding:0 14px}
.top .brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-right:12px}
.top .brand img{width:24px;height:24px;border-radius:6px}
.top .tab{border:0;background:none;color:rgba(255,255,255,.72);font:inherit;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer}
.top .tab[aria-pressed=true]{background:#fff;color:var(--navy)}
.top .r{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:12px;color:rgba(255,255,255,.6)}
.top .r a,.top .r button{color:rgba(255,255,255,.8);background:none;border:0;font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.kpi{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi div{flex:1 1 110px;background:#fff;padding:7px 12px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.kpi small{color:var(--muted);font-weight:700;font-size:12px}.kpi b{font-size:18px}
.kpi .w{background:#FFF6D6}.kpi .rd b{color:var(--warn)}
.wrap{padding:10px}
.lay{display:flex;gap:10px;align-items:flex-start}
.nav{width:156px;flex:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;position:sticky;top:56px}
.nav button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;font:inherit;font-weight:700;padding:7px 9px;border-radius:6px;cursor:pointer;color:var(--fg);text-align:left}
.nav button[aria-pressed=true]{background:var(--navy);color:#fff}
.nav i{font-style:normal;background:var(--warn);color:#fff;border-radius:9px;padding:0 6px;font-size:11px}
.nav span{color:var(--muted);font-weight:600;font-size:12px}.nav button[aria-pressed=true] span{color:rgba(255,255,255,.7)}
.nav hr{border:0;border-top:1px solid #EEF1F4;margin:5px 0}.nav .g{color:var(--muted);font-size:11px;padding:4px 9px 2px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.pn{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pn>h3{margin:0;padding:8px 12px;font-size:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #EEF1F4;flex-wrap:wrap}
.pn>h3 small{color:var(--muted);font-weight:600;font-size:12px}
.pn>h3 .r{margin-left:auto;display:flex;gap:6px}
.pn>.pd{padding:10px 12px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid #EEF1F4}
.seg{display:inline-flex;background:var(--bg);border-radius:6px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;font:inherit;font-weight:700;color:var(--muted);padding:4px 9px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
input,select,textarea{border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px}
input[type=search]{width:240px}
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;background:#fff;color:var(--fg);text-decoration:none;white-space:nowrap}
.btn.k{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.y{background:var(--gold);border-color:var(--gold)}.btn.red{color:var(--warn);border-color:#F1C0BB}
.btn.kakao{background:#FEE500;border-color:#FEE500;color:#191919}
.btn:disabled{opacity:.5;cursor:default}
.ml{margin-left:auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--soft);color:var(--muted);font-size:11.5px;font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid #EEF1F4;white-space:nowrap;vertical-align:middle}
td small{color:var(--muted);font-size:11.5px}
td.wrap{white-space:normal;max-width:360px}
tr.cl{cursor:pointer}tr.cl:hover td{background:#F4F8FF}tr.sel td{background:#E8F0FB}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.pl{display:inline-block;font-size:11px;font-weight:800;border-radius:4px;padding:1px 6px}
.pl.basic{background:#E6EEFB;color:#1C4FA0}.pl.premium,.pl.vip{background:#F1EAFB;color:#6741B8}.pl.trial{background:#E5F4EA;color:#1F7A4D}.pl.free,.pl.none{background:#EEF1F4;color:#5E6A77}.pl.op{background:#14212E;color:#fff}
.src{font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px;border:1px solid var(--line);color:var(--muted)}
.src.pay{color:#1F7A4D;border-color:#BFE3CC}.src.op{color:#B45309;border-color:#F3D19E;background:#FFF8EC}
.vf{font-size:10.5px;font-weight:800;border-radius:4px;padding:0 5px;margin-left:4px;background:#E2F4E9;color:var(--ok)}.vf.wait{background:#FFF4E5;color:#B26A00}.vf.no{background:#FDECEC;color:var(--warn)}
.dd{font-weight:800}.dd.r{color:var(--warn)}
.tag{font-size:11px;background:#FFF6D6;color:#7A5A00;border-radius:4px;padding:1px 5px;font-weight:700;display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.bav{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:5px;border:1px solid var(--line)}
/* 펼친 관리 칸 */
tr.det>td{background:#FBFCFD;padding:0;white-space:normal}
.det-g{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;padding:10px 12px;border:2px solid var(--navy);border-radius:8px;margin:6px}
.det-g h4{margin:0 0 6px;font-size:13px;display:flex;gap:6px;align-items:center}.det-g h4 small{color:var(--muted);font-weight:500}
.rw{display:flex;gap:5px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.rw>label{width:52px;color:var(--muted);font-weight:700;flex:none}
.ch{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.ch[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.pv{background:#FFF6D6;border-radius:6px;padding:6px 8px;font-weight:700;margin:4px 0 6px}
.note{font-size:11.5px;color:var(--muted);line-height:1.55}
.log{max-height:170px;overflow:auto}.log div{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed #EEF1F4;font-size:12px}.log em{font-style:normal;color:var(--muted);width:70px;flex:none}
.kv{display:grid;grid-template-columns:62px 1fr;gap:3px 8px;font-size:12px}.kv b{color:var(--muted);font-weight:700}
/* 통계 */
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.sts div{background:#fff;padding:8px 12px}.sts small{display:block;color:var(--muted);font-weight:700;font-size:11.5px}.sts b{font-size:18px}
.bars{display:flex;align-items:flex-end;gap:2px;height:64px;padding:8px 12px 0}
.bars div{flex:1;background:var(--gold);border-radius:2px 2px 0 0;min-height:2px}.bars div.today{background:var(--navy)}.bars.dk div{background:#5E6A77}.bars.dk div.today{background:var(--navy)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:3px 12px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;max-width:560px;margin:30px auto}
.card h2{margin:0 0 6px;font-size:16px}.card p{color:var(--muted);margin:0 0 10px;line-height:1.6}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:700;background:var(--soft);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;display:inline-block;margin:4px 0 10px;user-select:all}
.err{color:var(--warn);margin-top:8px}
@media (max-width:1000px){.lay{flex-direction:column}.nav{width:100%;position:static;display:flex;flex-wrap:wrap}.nav button{width:auto}.nav hr,.nav .g{display:none}.det-g{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.sts{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="top"><span class="brand"><img src="/favicon.svg" alt="">리얼맵 운영</span>
  <button class="tab" type="button" data-tab="br" aria-pressed="true">중개사</button><button class="tab" type="button" data-tab="visit">방문·가입</button><button class="tab" type="button" data-tab="mem">일반 회원</button><button class="tab" type="button" data-tab="zone">정비사업 알림</button>
  <span class="r"><span id="upd"></span><button type="button" id="reload">새로 고침</button><a href="/pro.html" target="_blank">소개 페이지</a><a href="/">리얼맵</a></span></div>
<div id="app"><div class="card"><p>확인하는 중입니다…</p></div></div>
<script>
(function () {
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const d8 = s => s ? new Date(s).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', year: '2-digit', month: '2-digit', day: '2-digit' }).replace(/\s/g, '').replace(/\.$/, '') : '-';
  const dt = s => s ? new Date(s).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', year: '2-digit', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '-';
  const left = s => s ? Math.ceil((new Date(s) - Date.now()) / 864e5) : null;
  const ago = s => { if (!s) return '-'; const d = Math.floor((Date.now() - new Date(s)) / 864e5); return d <= 0 ? '오늘' : d === 1 ? '어제' : d < 30 ? d + '일 전' : d8(s); };
  const man = v => !v ? '' : v >= 10000 ? (v / 10000).toFixed(v % 10000 ? 1 : 0).replace(/\.0$/, '') + '억' : v.toLocaleString() + '만';
  const PN = { free: '무료', trial: '2주 체험', basic: 'Basic', premium: 'Premium', vip: 'VIP', none: '시작 전' };
  const PAID = ['basic', 'premium', 'vip'];
  let pw = ''; try { pw = sessionStorage.getItem('rm.adm') || ''; } catch (e) { /* 무시 */ }
  let tab = (location.hash.slice(1) || 'br'); if (!['br', 'visit', 'mem', 'zone'].includes(tab)) tab = 'br';
  let B = null, M = null, ZN = null;           // B: 중개사 자료 · M: 회원·통계 자료
  let sec = 'list', f = 'all', q = '', open = null, ps = null, onlyMk = false;

  document.querySelectorAll('.top .tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; history.replaceState(null, '', '#' + tab); go(); });
  document.getElementById('reload').onclick = () => { if (tab === 'br') loadB(); else loadM(); };
  fetch('/api/auth?action=me').then(r => r.json()).then(me => { if (!me.member) return login(); pw ? go() : askPw(); })
    .catch(() => { app.innerHTML = '<div class="card"><p>상태를 확인하지 못했습니다. 잠시 후 새로고침해 주세요.</p></div>'; });
  function go() {
    document.querySelectorAll('.top .tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
    if (tab === 'br') B ? drawB() : loadB(); else M ? drawM() : loadM();
  }
  function login() { app.innerHTML = `<div class="card"><h2>운영자 로그인</h2><p>운영자 카카오 계정으로 로그인해 주세요.</p><a class="btn kakao" href="/auth/login?r=${encodeURIComponent('/brokers.html')}">카카오로 로그인</a></div>`; }
  function askPw(msg) {
    app.innerHTML = `<div class="card"><h2>관리자 비밀번호</h2><p>Vercel에 넣어 둔 ADMIN_PASSWORD입니다. 이 창을 닫으면 다시 물어봅니다.</p><form id="f" style="display:flex;gap:6px"><input type="password" id="pw" autocomplete="current-password" placeholder="관리자 비밀번호" required style="flex:1"><button class="btn k" type="submit">확인</button></form>${msg ? `<p class="err">${esc(msg)}</p>` : ''}</div>`;
    document.getElementById('f').onsubmit = e => { e.preventDefault(); pw = document.getElementById('pw').value; try { sessionStorage.setItem('rm.adm', pw); } catch (x) { /* 무시 */ } go(); };
    document.getElementById('pw').focus();
  }
  function bad(j) {   // 공통 오류 처리 → 화면을 바꿨으면 true
    if (j.error === 'login') { login(); return true; }
    if (j.error === 'password') { try { sessionStorage.removeItem('rm.adm'); } catch (e) { /* 무시 */ } askPw('비밀번호가 맞지 않습니다.'); return true; }
    if (j.error === 'setup') { app.innerHTML = `<div class="card"><h2>처음 한 번만 설정해 주세요</h2><p>지금 로그인한 카카오 계정의 회원번호입니다. 운영자(선배) 계정이 맞다면 Vercel 환경변수 <b>ADMIN_KAKAO_ID</b>에 넣고 Redeploy 해 주세요.</p><div class="code">${esc(j.myId)}</div></div>`; return true; }
    return false;
  }
  async function call(url, body) {
    const r = await fetch(url, { method: body ? 'POST' : 'GET', headers: { 'x-admin-key': pw, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    return r.json().catch(() => ({ ok: false, message: '서버 응답을 읽지 못했습니다. api 폴더의 members.js·auth.js가 최신인지 확인해 주세요.' }));
  }
  const stamp = () => { document.getElementById('upd').textContent = '새로 고침 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }); };
  async function loadB() {
    if (!B) app.innerHTML = '<div class="card"><p>중개사 자료를 불러오는 중입니다…</p></div>';
    const j = await call('/api/members?part=brokers'); if (bad(j)) return;
    if (!j.ok) { app.innerHTML = `<div class="card"><h2>열 수 없습니다</h2><p>${esc(j.message || '오류가 발생했습니다.')}</p></div>`; return; }
    B = j; stamp(); if (tab === 'br') drawB();
  }
  async function act(body, msg) {   // 처리 → 목록 다시
    const j = await call('/api/members?part=brokers', body);
    if (bad(j)) return null; if (!j.ok) { alert(j.message || '처리하지 못했습니다.'); return null; }
    if (msg !== false) await loadB(); return j;
  }

  // ===================== 중개사 =====================
  function kind(r) {   // 받은 방법
    const P = r.plan, s = r.src || {};
    if (P.op) return ['op', '운영자 계정'];
    if (P.plan === 'free' || P.plan === 'none') return ['', P.ended ? (P.ended === 'trial' ? '체험 끝' : '기간 끝') : P.plan === 'none' ? '시작 전' : '무료'];
    if (s.by === 'pay') return ['pay', `결제${s.mon ? ' ' + s.mon + '개월' : ''}`];
    if (s.by === 'op') return ['op', `운영자 혜택${s.why ? ' · ' + s.why : ''}`];
    if (P.plan === 'trial') return ['', '체험'];
    return ['', P.legacy ? '예전 회원' : '-'];
  }
  const isGift = r => !r.plan.op && (r.src || {}).by === 'op' && r.plan.plan !== 'free';
  const isPaid = r => !r.plan.op && PAID.includes(r.plan.plan) && (r.src || {}).by !== 'op';
  const isSoon = r => !r.plan.op && r.plan.plan !== 'free' && r.plan.until && left(r.plan.until) <= 7;
  const FIL = { all: ['전체', r => !r.plan.op], trial: ['체험', r => r.plan.plan === 'trial' && !isGift(r)], paid: ['유료', isPaid], gift: ['운영자 혜택', isGift], free: ['무료', r => r.plan.plan === 'free'], soon: ['곧 끝남', isSoon], wait: ['승인 대기', r => r.bk && r.bk.pend] };
  function drawB() {
    const R = B.rows, P = B.pays || [], Q = B.qnas || [], V = B.visits || [];
    const ym = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 7);
    const income = P.filter(p => p.st === 'ok' && p.done && new Date(new Date(p.done).getTime() + 9 * 3600e3).toISOString().slice(0, 7) === ym).reduce((a, p) => a + (p.amt || 0), 0);
    const n = k => R.filter(FIL[k][1]).length, waitP = P.filter(p => p.st === 'wait').length, openQ = Q.filter(x => !x.reply).length, newV = V.filter(v => v.st === 'new').length;
    const NAV = [['list', '중개사 회원', n('all')], ['pay', '입금 확인', waitP, 1], ['qna', '문의', openQ, 1], ['vreq', '방문 신청', newV, 1], ['pub', '지도 광고', B.pubs.length], '-', ['log', '요금 변경 이력', (B.plog || []).length], ['dup', '중복 가입 의심', (B.dups || []).length]];
    app.innerHTML = `<div class="kpi"><div><small>중개사</small><b>${n('all')}</b></div><div><small>체험 중</small><b>${n('trial')}</b></div><div><small>유료(결제)</small><b>${n('paid')}</b></div>
      <div class="${n('gift') ? 'w' : ''}"><small>운영자 혜택</small><b>${n('gift')}</b></div><div><small>무료</small><b>${n('free')}</b></div><div class="${n('soon') ? 'rd' : ''}"><small>7일 안에 끝남</small><b>${n('soon')}</b></div>
      <div class="${n('wait') ? 'rd' : ''}"><small>승인 대기</small><b>${n('wait')}</b></div><div class="${waitP ? 'w' : ''}"><small>입금 대기</small><b>${waitP}</b></div><div class="${openQ ? 'rd' : ''}"><small>답변 전 문의</small><b>${openQ}</b></div>
      <div class="${newV ? 'w' : ''}"><small>새 방문 신청</small><b>${newV}</b></div><div><small>지도 광고</small><b>${B.pubs.length}</b></div><div><small>이번 달 입금</small><b>${income.toLocaleString()}원</b></div></div>
      <div class="wrap"><div class="lay"><div class="nav">${NAV.map(x => x === '-' ? '<hr><div class="g">기록</div>' : `<button type="button" data-sec="${x[0]}" aria-pressed="${sec === x[0]}">${x[1]} ${x[3] ? (x[2] ? `<i>${x[2]}</i>` : '') : `<span>${x[2]}</span>`}</button>`).join('')}</div>
      <div class="main" id="main"></div></div></div>`;
    app.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { sec = b.dataset.sec; drawB(); });
    const m = document.getElementById('main');
    ({ list: secList, pay: secPay, qna: secQna, vreq: secVisit, pub: secPub, log: secLog, dup: secDup })[sec](m);
  }
  function secList(m) {
    const R = B.rows.filter(FIL[f][1]).filter(r => !q || JSON.stringify([r.nickname, r.bk, r.opmemo]).toLowerCase().includes(q.toLowerCase()));
    const COLS = 11;
    m.innerHTML = `<div class="pn"><div class="bar"><span class="seg">${Object.entries(FIL).map(([k, [t, fn]]) => `<button type="button" data-f="${k}" aria-pressed="${f === k}">${t} ${B.rows.filter(fn).length}</button>`).join('')}</span>
      <input type="search" id="q" placeholder="사무소·대표·등록번호·전화·메모 찾기" value="${esc(q)}"><button class="btn ml" type="button" id="csv">엑셀로 저장</button></div>

    document.getElementById('mk').onchange = e => { onlyMk = e.target.checked; drawM(); };
    const qq = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    document.getElementById('csv').onclick = () => dl(`리얼맵_회원_${new Date().toISOString().slice(0, 10)}.csv`, [['닉네임', '이메일', '가입일', '최근 로그인', '소식 수신', '동의 일시', '관심 부동산', '관심 구역', '추진 알림'].map(qq).join(',')].concat(rows.map(r => [r.nickname, r.email, dt(r.joined), dt(r.last), r.marketing ? '동의' : '미동의', r.marketing ? dt(r.marketingAt) : '', r.favs || 0, r.zones || 0, r.zalerts || 0].map(qq).join(','))));
  }
  function tZone(m) {
    const z = M.zsum || {}, zr = M.zrank || [], al = M.alerts || [];
    m.innerHTML = `<div class="g2"><div class="pn"><h3>인기 관심 구역 <small>어느 구역에 관심이 많은지</small></h3>${sts([['담은 회원', z.members || 0], ['알림 신청 회원', z.alertMembers || 0], ['담긴 구역', z.zones || 0], ['알림 신청', al.length]])}
        <div class="tw"><table><thead><tr><th>구역</th><th>구</th><th>추진 단계</th><th>담은 회원</th><th>알림 신청</th></tr></thead><tbody>
        ${zr.map(x => { const n = ZN && ZN[x.id]; return `<tr><td>${esc(x.n)}</td><td>${esc(x.gu)}</td><td>${esc((n && n.st) || x.st || '-')}</td><td>${x.cnt}</td><td>${x.alert || '-'}</td></tr>`; }).join('') || '<tr><td colspan="5" class="empty">아직 담긴 구역이 없습니다</td></tr>'}</tbody></table></div></div>
      <div class="pn"><h3>추진 알림 신청자 <small>${al.length}건</small><span class="r"><button class="btn" type="button" id="alCsv">엑셀(CSV)</button></span></h3><div class="tw"><table><thead><tr><th>닉네임</th><th>알림 이메일</th><th>구역</th><th>구</th><th>신청 당시 단계</th><th>담은 날</th></tr></thead><tbody>
        ${al.map(x => `<tr><td>${esc(x.nickname || '-')}</td><td>${esc(x.email)}</td><td>${esc(x.zone)}</td><td>${esc(x.gu)}</td><td>${esc(x.st || '-')}</td><td>${dt(x.at)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">아직 신청자가 없습니다</td></tr>'}</tbody></table></div>
        <div class="pd note">· 알림 이메일은 회원이 직접 확인·동의한 주소입니다. 단계 변경 알림 외의 광고 메일에는 쓰지 마세요.</div></div></div>`;
    const qq = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    document.getElementById('alCsv').onclick = () => dl(`리얼맵_추진알림신청자_${new Date().toISOString().slice(0, 10)}.csv`, [['닉네임', '알림 이메일', '구역', '구', '신청 당시 단계', '담은 날', '이메일 동의일'].map(qq).join(',')].concat(al.map(x => [x.nickname, x.email, x.zone, x.gu, x.st, dt(x.at), dt(x.emailAt)].map(qq).join(','))));
  }
})();
</script>
