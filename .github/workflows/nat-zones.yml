name: realmap-nat-zones
# 국토부 전국 도시정비사업 통합 데이터를 받아 저장소에 저장 (분기마다 + 수동 실행) — 경기·인천 정비사업 페이지용 (10/29)
on:
  schedule:
    - cron: '0 20 6 1,4,7,10 *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/nat-zones.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 바뀐 자료 저장
        run: |
          git config user.name "realmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nat-zones-raw.json
          git diff --cached --quiet || (git commit -m "전국 도시정비사업 자료 갱신" && (git push || (git pull --rebase origin main && git push)))
