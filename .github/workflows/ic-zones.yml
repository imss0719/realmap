name: realmap-ic-zones
# 인천 정비사업: 국토부 전국 자료(data/nat-zones-raw.json · nat-zones 작업이 받아 둠) → 위치·경계 → 인천 페이지(incheon/) 만들기 (분기마다 + 수동 실행) — 10/30
#   서울·경기 페이지 위쪽 줄에 '인천' 링크가 들어가도록 서울·경기 페이지도 같이 다시 만듦 (자료는 그대로)
on:
  schedule:
    - cron: '0 21 6 1,4,7,10 *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 위치·경계 붙이기
        run: node scripts/ic-zones-build.mjs
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      - name: 인천 페이지 만들기
        run: node scripts/ic-pages.mjs
      - name: 경기·서울 페이지 다시 만들기 (위쪽 줄 '인천' 링크)
        run: |
          node scripts/gg-pages.mjs
          node scripts/seoul-pages.mjs
      - name: 바뀐 자료 저장
        run: |
          git config user.name "realmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ic-zones.json data/ic-geo-memo.json incheon gyeonggi seoul sitemap.xml sitemap-gg.xml sitemap-ic.xml robots.txt
          git diff --cached --quiet || (git commit -m "인천 정비사업 자료·페이지 갱신" && (git push || (git pull --rebase origin main && git push)))
