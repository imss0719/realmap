name: realmap-academy
# 서울 학원가 자료 (나이스 학원교습소정보 + 카카오 좌표) — 매달 + 수동 실행 · 11/5
on:
  schedule:
    - cron: '23 19 5 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/academy.mjs
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      - name: 바뀐 자료 저장
        if: always()
        run: |
          git config user.name "realmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/aca-11.json data/aca-memo.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "서울 학원가 자료 갱신" && (git push || (git pull --rebase origin main && git push)))
