name: realmap-gg-zones
# 경기 정비사업: 경기데이터드림 자료 받기 → 좌표·경계 → 경기 페이지(gyeonggi/) 만들기 (분기마다 + 수동 실행) — 10/30
#   서울 페이지 위쪽 줄에 '경기' 링크가 들어가도록 서울 페이지도 같이 다시 만듦 (자료는 그대로)
on:
  schedule:
    - cron: '30 20 6 1,4,7,10 *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 경기도 자료 받기 (경기 서버가 안 받으면 지난번 자료로 계속)
        run: node scripts/gg-zones.mjs
        continue-on-error: true
        env:
          GG_OPENAPI_KEY: ${{ secrets.GG_OPENAPI_KEY }}
      - name: 좌표·경계 붙이기
        run: node scripts/gg-zones-build.mjs
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      - name: 경기 페이지 만들기
        run: node scripts/gg-pages.mjs
      - name: 서울 페이지 다시 만들기 (위쪽 줄 '경기' 링크)
        run: node scripts/seoul-pages.mjs
      - name: 바뀐 자료 저장
        run: |
          git config user.name "realmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gg-zones-raw.json data/gg-zones.json data/gg-geo-memo.json gyeonggi seoul sitemap.xml sitemap-gg.xml robots.txt
          git diff --cached --quiet || (git commit -m "경기 정비사업 자료·페이지 갱신" && git push)
