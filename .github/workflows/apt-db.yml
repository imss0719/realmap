name: realmap-apt-db
# 10/30 서울 아파트 단지별 면적·공급평·추정 타입 데이터베이스 (scripts/apt-db.mjs) — 수동 실행
#   [Run workflow]에서 구 코드를 넣고 실행 (기본: 마포 11440 · 여러 구는 쉼표로: 11440,11410,11380)
#   하루 요청 한도가 있어 한 번에 다 못 받으면 멈추고 저장 → 다시 실행하면 이어서 받음
on:
  workflow_dispatch:
    inputs:
      gus:
        description: '구 코드 (쉼표로 여러 개 · 마포 11440 · 서대문 11410 · 은평 11380)'
        default: '11440'
      max_calls:
        description: '이번 실행 최대 요청 수 (공공데이터 하루 한도 안에서)'
        default: '6000'
      refresh:
        description: '처음부터 다시 받기 (1)'
        default: '0'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: 단지별 면적·공급평 받기
        run: node scripts/apt-db.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GUS: ${{ github.event.inputs.gus }}
          MAX_CALLS: ${{ github.event.inputs.max_calls }}
          REFRESH: ${{ github.event.inputs.refresh }}
          MINUTES: '50'
      - name: 저장
        run: |
          git config user.name "realmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/apt
          git diff --cached --quiet || (git commit -m "아파트 단지 면적 데이터베이스 갱신" && (git push || (git pull --rebase origin main && git push)))
