<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리얼맵</title>
<meta name="description" content="지도에서 필지를 누르면 로드뷰, 토지, 소유, 토지이용계획, 건축물대장, 호별 면적, 실거래가를 한 번에 확인합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="mark"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1h6v4h4v6H1z" fill="none" stroke="#fff" stroke-width="1.6"/></svg></span>
      <b id="siteName">리얼맵</b>
      <a href="check.html">연결 점검</a>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6"/></svg>
      <input id="q" type="search" placeholder="주소, 지번, 건물명 검색" autocomplete="off" aria-label="주소 검색">
      <div class="sugg" id="sugg" hidden></div>
    </div>
  </div>

  <aside class="panel" id="panel" aria-label="필지 정보">
    <div class="sheet-head"><span class="grab"></span><button id="close" aria-label="닫기">×</button></div>
    <div class="intro" id="intro">
      <b>지도에서 필지를 눌러 주세요</b>
      <span>로드뷰와 함께 토지, 소유, 토지이용계획, 건축물대장, 호별 면적, 실거래가를 한 번에 보여 드립니다.</span>
    </div>
    <div class="rvwrap" id="rvwrap" hidden>
      <div id="rv"></div>
      <span class="cap">로드뷰</span>
      <button class="big" id="rvbig" type="button">크게 보기</button>
      <div class="none" id="rvnone" hidden>이 필지 주변에는 로드뷰 사진이 없습니다.</div>
    </div>
    <div id="detail"></div>
  </aside>

  <div class="map">
    <div id="map"></div>
    <div class="mapctl">
      <div class="grp" role="group" aria-label="지도 종류">
        <button id="mtRoad" aria-pressed="true">일반</button>
        <button id="mtSky" aria-pressed="false">위성</button>
      </div>
      <div class="grp">
        <button id="mtCad" aria-pressed="true">지적도</button>
      </div>
    </div>
    <div class="viewtog" role="group" aria-label="보기 전환">
      <button id="vMap" aria-pressed="true">지도</button>
      <button id="vRv" aria-pressed="false">로드뷰</button>
    </div>
    <div class="bigrv" id="bigrv" hidden>
      <div id="bigrvView"></div>
      <div class="none" id="bigrvNone" hidden>이 위치에는 로드뷰 사진이 없습니다.<br>왼쪽 아래 작은 지도에서 파란 선(촬영된 도로)을 눌러 주세요.</div>
      <div class="mini"><div id="miniMap"></div><span>파란 선을 누르면 그 위치로 이동합니다</span></div>
    </div>
    <div class="toast" id="toast" hidden></div>
    <div class="setup" id="setup" hidden></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
