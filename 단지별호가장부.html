<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호가 장부</title>
<style>
:root{--ink:#111827;--ink2:#374151;--sub:#6B7280;--faint:#9CA3AF;--line:#E5E7EB;--line2:#F1F3F6;--bg:#EEF1F5;--top:#1C2230;--blue:#1D4ED8;--blue-bg:#EEF4FF;--red:#DC2626;--yellow:#F5B800;--green:#16A34A;--green2:#15803D;--green-bg:#EAF7EF;--green-bd:#86C9A0;--orange:#8A4B08;--orange-bg:#FEF3E2;--th:#F7F8FA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;font-size:13px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,td:focus-visible,th:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
/* 상단 바 */
#top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;height:46px;background:var(--top);color:#fff;position:sticky;top:0;z-index:5}
.brand{font-size:16px;font-weight:800}
.pc{font-size:10px;font-weight:800;background:var(--yellow);color:var(--top);padding:2px 7px;border-radius:99px;margin-left:6px}
.ttab{min-height:30px;padding:0 12px;border-radius:7px;border:0;background:transparent;color:#CBD2DC}
.ttab:hover{color:#fff}.ttab.on{background:#fff;color:var(--top);font-weight:800}
.ttab em{font-style:normal;font-size:11px;color:#8B95A5;margin-left:2px}.ttab.on em{color:var(--sub)}
.tsearch{display:flex;align-items:center;background:#fff;border-radius:7px;padding:0 10px;width:220px;height:30px}
.tsearch input{border:0;outline:0;font:inherit;width:100%;background:transparent;color:var(--ink)}
.ybtn{min-height:30px;padding:0 14px;border-radius:7px;border:0;background:var(--yellow);color:var(--top);font-weight:800}
.gbtn{min-height:30px;padding:0 10px;border-radius:7px;border:1px solid #3A4456;background:transparent;color:#CBD2DC;font-size:12px}
.gbtn:hover{color:#fff}.gbtn.on{background:var(--yellow);border-color:var(--yellow);color:var(--top);font-weight:800}
/* 둘째 줄 */
#sub{display:flex;align-items:center;gap:2px;padding:0 12px;min-height:40px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stab{min-height:28px;padding:0 12px;border-radius:6px;border:1px solid transparent;background:transparent;font-weight:700;color:var(--ink2)}
.stab em{font-style:normal;font-size:11px;color:var(--faint);margin-left:3px}
.stab.on{background:var(--top);color:#fff}.stab.on em{color:var(--yellow)}
.stab.ol{border-color:var(--top);background:#fff;color:var(--ink);font-weight:800}
.stab.lt{font-weight:400;color:var(--sub)}
.sep{width:1px;height:16px;background:var(--line);margin:0 8px}
/* 틀 */
.shell{display:flex;gap:12px;padding:12px;align-items:flex-start}
aside{flex:0 0 236px;background:#fff;border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:1px;position:sticky;top:98px;max-height:calc(100vh - 110px);overflow:auto}
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.ahd{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.seg2{display:flex;border:1px solid #D1D5DB;border-radius:6px;overflow:hidden;font-size:12px}
.seg2 button{min-height:26px;padding:0 9px;border:0;background:#fff}
.seg2 button.on{background:var(--yellow);font-weight:800}
.tg,.td{display:flex;align-items:center;gap:5px;width:100%;text-align:left;border:0;background:none;border-radius:6px}
.tg{padding:6px 6px 3px;font-weight:800;font-size:13px}
.td{padding:3px 6px 3px 16px;font-weight:700;font-size:12px;color:#4B5563}
.tg:hover,.td:hover{background:#F3F4F6}
.tg em,.td em{font-style:normal;margin-left:auto;color:var(--faint);font-weight:400;font-size:12px}
.ar{display:inline-block;width:9px;font-size:9px;color:var(--faint)}
.cxr{display:flex;align-items:center;gap:7px;padding:2px 4px 2px 20px;border-radius:7px}
.cxr:hover{background:#F6F7F9}
.cxr.on{background:var(--blue-bg)}
.cxr input{width:15px;height:15px;margin:0;accent-color:var(--top);flex:none;cursor:pointer}
.cxr button{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;padding:5px 2px;text-align:left}
.cxr button b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:13px}
.cxr.on button b{color:var(--blue);font-weight:800}
.cxr button em{font-style:normal;font-size:12px;color:var(--faint)}
.afoot{display:flex;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.lnk{min-height:30px;padding:0 6px;border:0;background:none;color:var(--blue);font-weight:700}
.gcta{flex:1;min-height:32px;border-radius:7px;border:1px solid var(--green-bd);background:var(--green-bg);color:var(--green2);font-weight:800}
/* 카드 */
.card{background:#fff;border-radius:12px;padding:12px 14px}
.card h3{margin:0;font-size:13px;font-weight:800}
.note{font-weight:400;color:var(--sub);font-size:11px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
/* 단지 현황: 타입×층 */
.mx{font-size:13px;min-width:600px}
.mx th{color:var(--ink2);font-size:12px;font-weight:700;padding:5px 8px;background:var(--th);border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.mx th:first-child{text-align:left}
.mx td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
.mx td:first-child{text-align:left}
.mx tr.g td{background:#F7F9FC;font-weight:800;padding:6px 8px}
.mx td.c{cursor:pointer;border-radius:5px}.mx td.c:hover{background:#EEF4FF}
.mx td.sel{box-shadow:inset 0 0 0 2px var(--blue);background:#fff}
.mx .lo{color:var(--red);font-weight:800}.mx .ct{color:var(--faint);font-weight:400}.mx .no{color:#CBD2DC}
.bars{display:flex;flex-direction:column;gap:3px;font-size:12px}
.bar{display:grid;grid-template-columns:88px 1fr 28px;gap:8px;align-items:center;border:0;background:none;padding:2px 4px;border-radius:5px;text-align:left}
.bar:hover{background:#F6F7F9}.bar.on{background:var(--blue-bg)}
.bar i{display:block;height:12px;border-radius:3px;background:var(--blue)}
.bar i.r{background:var(--red)}.bar i.z{background:var(--line)}
.bar b{text-align:right;font-weight:400}
.segc{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.segc span{font-size:11px;color:var(--sub);margin-right:2px}
.chip{min-height:26px;padding:0 10px;border-radius:6px;border:1px solid #D1D5DB;background:#fff;font-size:12px}
.chip.on{background:var(--top);border-color:var(--top);color:#fff;font-weight:700}
.chip.x{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);font-weight:700}
/* 목록 */
.lst{font-size:13px;min-width:860px;border:1px solid var(--line)}
.lst th{color:var(--ink2);font-size:12px;font-weight:700;padding:6px 8px;background:var(--th);border-bottom:1px solid var(--line);border-right:1px solid #EEF0F3;text-align:center;white-space:nowrap}
.lst th.s{cursor:pointer}.lst th.s:hover{color:var(--blue)}
.lst td{padding:6px 8px;border-bottom:1px solid var(--line2);border-right:1px solid #F3F4F6;white-space:nowrap;text-align:center}
.lst tr:hover td{background:#FAFBFD}
.lst td.k{font-weight:700}
.lst td.p{font-weight:800;color:var(--blue);text-align:right}
.lst td.p.min{color:var(--red)}
.lst td.p small{font-size:11px;color:var(--sub);font-weight:400}
.lst td.f{color:#4B5563;font-size:12px;white-space:normal;text-align:left;min-width:200px;max-width:340px}
.lst td.o{color:var(--sub);font-size:12px;text-align:left}
.lst tr.gone td{color:var(--faint)}
.lst small.d{color:var(--faint);font-size:11px;font-weight:400}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;margin-left:4px;vertical-align:1px;font-weight:700}
.tag.new{background:var(--green-bg);color:var(--green2)}.tag.gone{background:#F1F2F4;color:#4B5563}.tag.mg{background:var(--orange-bg);color:var(--orange)}.tag.st{background:#F1F2F4;color:#4B5563}
.tag.rec{border:1px solid var(--green-bd);color:var(--green2);background:#fff}
/* 비교표 */
.cmp{font-size:13px;min-width:1060px;text-align:center;border:1px solid var(--line)}
.cmp th{padding:5px 6px;border-bottom:1px solid var(--line);border-right:1px solid #EEF0F3;font-weight:700;color:var(--ink2);background:var(--th);white-space:nowrap;font-size:12px}
.cmp td{padding:7px 6px;border-bottom:1px solid #EEF0F3;border-right:1px solid #F3F4F6;white-space:nowrap}
.cmp tr.win td{background:#F3FBF6}
.rk{display:inline-flex;width:20px;height:20px;border-radius:5px;color:#fff;font-weight:800;font-size:11px;align-items:center;justify-content:center}
.gz{position:relative;height:16px;flex:1}
.gz .b{position:absolute;left:0;right:0;top:6px;height:4px;border-radius:99px;background:linear-gradient(90deg,#BFE5CC 0%,#EEF0F3 30%,#EEF0F3 60%,#F5C8C2 100%)}
.gz .m{position:absolute;top:1px;width:1px;height:14px;background:var(--ink)}
.gz .d{position:absolute;top:2px;width:12px;height:12px;border-radius:99px;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3);margin-left:-6px}
.concl{display:flex;align-items:center;gap:8px;background:var(--green-bg);border:1px solid #BFE5CC;border-radius:8px;padding:6px 12px}
.concl i{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--green);padding:2px 7px;border-radius:4px;white-space:nowrap}
.btn{min-height:30px;padding:0 12px;border-radius:7px;border:1px solid #D1D5DB;background:#fff;font-size:12px}
.btn.on{background:var(--top);color:#fff;border-color:var(--top)}
.btn.danger{color:var(--red);border-color:#F0B7B2}
.big{min-height:40px;border-radius:8px;border:0;background:var(--yellow);color:var(--top);font-size:15px;font-weight:800;padding:0 20px}
textarea{width:100%;min-height:170px;padding:12px 14px;border-radius:8px;border:1px dashed #A9B0BA;font:inherit;font-size:13px;resize:vertical;background:#F8F9FA}
.msg{border-radius:8px;padding:9px 14px;font-size:13px;line-height:1.6}
.msg.ok{background:var(--green-bg);color:var(--green2)}.msg.warn{background:var(--orange-bg);color:var(--orange)}
dialog{border:0;border-radius:14px;padding:20px;max-width:720px;width:92vw}
dialog::backdrop{background:rgba(17,24,39,.45)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;margin-bottom:12px}
.fld input,.fld select{min-height:38px;padding:0 10px;border-radius:7px;border:1px solid #C5CAD3;font:inherit;font-size:14px;font-weight:400;background:#fff}
.cand{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;font-size:13px}
.cand input{width:16px;height:16px;accent-color:var(--top)}
.empty{padding:40px 20px;text-align:center;color:var(--sub);line-height:1.8}
.stat{border-radius:8px;padding:8px 10px;border:0;text-align:left;width:100%}
.stat div:last-child{font-size:20px;font-weight:800}
.link{border:0;background:none;color:var(--blue);text-decoration:underline;font-size:11px;padding:0}
@media (max-width:900px){.shell{flex-direction:column}aside{position:static;max-height:none;width:100%;flex:none}.tsearch{display:none}}
</style>
</head>
<body>
<header id="top"></header>
<nav id="sub"></nav>
<div class="shell"><aside id="side"></aside><main id="main"></main></div>
<dialog id="dlg"></dialog>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<script>
/* ===== 읽기(파싱) ===== */
function won(s){
  s=(s||'').replace(/\s/g,'');
  var m=s.match(/^(?:([\d,]+)억)?([\d,]+)?/);
  if(!m) return 0;
  var e=parseInt((m[1]||'0').replace(/,/g,''),10), r=parseInt((m[2]||'0').replace(/,/g,''),10);
  return e*10000+r;
}
var KIND_RE=/^(매매|전세|월세|단기임대)\s*(\d[\d,억\s~\/]*)$/;
var SKIP=/^(관심매물|매물목록 펼치기|매물 보러가기|매물 이미지|네이버에서 보기|공인중개사협회매물|"+|“|”)/;
function isSkip(t){return t===''||SKIP.test(t)}
function normDate(s){var p=(s||'').replace(/\.$/,'').split('.');if(p.length<3)return s;if(p[0].length===2)p[0]='20'+p[0];return p[0]+'.'+p[1]+'.'+p[2]}
var DATE_RE=/^(?:집주인)?(확인매물|등록일|등록)\s*(\d{2,4}\.\d{1,2}\.\d{1,2})\.?\s*(?:중개사\s*(\d+)곳.*)?(?:네이버에서 보기)?$/;
function parseListings(raw){
  var L=raw.replace(/\r/g,'').replace(/m²|m2(?=[,\s])/g,'㎡').split(/\n|\t/).map(function(s){return s.replace(/ /g,' ').trim()});
  var M=[];
  for(var i=0;i<L.length;i++){
    if(L[i]==='집주인'&&i+1<L.length&&/^확인매물/.test(L[i+1])){M.push('집주인'+L[i+1]);i++;continue}
    M.push(L[i]);
  }
  L=M;
  var screenCount=null;
  for(i=0;i<Math.min(L.length,40);i++){
    var sm=L[i].match(/^(?:매물\s*)?([\d,]+)개$/);
    if(sm&&(i===0||L[i-1]==='매물'||/^매물/.test(L[i]))){screenCount=parseInt(sm[1].replace(/,/g,''),10);break}
  }
  var anchors=[];
  for(i=0;i<L.length;i++){
    if(KIND_RE.test(L[i])&&/㎡/.test((L[i+1]||'')+(L[i+2]||''))) anchors.push(i);
  }
  function headerIdx(p,floor){var h=p-1;while(h>floor&&(L[h]===''||L[h]==='관심매물'))h--;return h}
  var heads=anchors.map(function(p,ix){return headerIdx(p,ix?anchors[ix-1]:-1)});
  var out=[];
  anchors.forEach(function(p,ix){
    var it={cx:'',dong:''};
    var h=heads[ix], hl=L[h]||'';
    if(h>(ix?anchors[ix-1]:-1)&&!isSkip(hl)&&!KIND_RE.test(hl)&&!DATE_RE.test(hl)&&!/^중개사\s*\d/.test(hl)&&!/㎡/.test(hl)&&!/제공$/.test(hl)){
      if(/^집주인./.test(hl)){it.owner=true;hl=hl.replace(/^집주인/,'')}
      var hm=hl.match(/^(.*?)\s+(\S+동)$/);
      if(hm){it.cx=hm[1];it.dong=hm[2]} else it.cx=hl;
    }
    var km=L[p].match(KIND_RE); it.kind=km[1];
    if(it.kind==='단기임대'){it.kind='월세';it.short=true}
    var pr=km[2], parts=pr.split('~');
    if(pr.indexOf('/')>=0){
      var a=parts.map(function(x){var q=x.split('/');return {d:won(q[0]),r:won(q[1]||'0')}});
      it.dep=a[0].d;it.rent=a[0].r;
      if(a.length>1&&(a[1].d!==a[0].d||a[1].r!==a[0].r)){it.dep2=a[a.length-1].d;it.rent2=a[a.length-1].r}
      it.lo=it.dep;it.hi=it.dep2!=null?it.dep2:it.dep;
    }
    else{var ps=parts.map(won);it.lo=ps[0];it.hi=ps[ps.length-1]}
    var k=p+1, acc=L[k]||'';
    while(k+1<L.length&&(/^\d+[A-Z]*㎡/.test(L[k+1])||/^\(전용/.test(L[k+1])||/^[^\s/]+\/\d+층/.test(L[k+1])||/^[동서남북]+향$/.test(L[k+1]))){acc+=L[k+1];k++}
    var g=acc.match(/^(\D*?)(\d+)([A-Z]*)㎡\s*\(전용([\d.]+)[A-Z]*\)\s*(?:([^\s/]+)\/(\d+)층)?\s*(.*)$/);
    if(g){it.ptype=g[1];it.sup=parseInt(g[2],10);it.type=g[3]||'';it.ex=parseFloat(g[4]);it.fl=g[5]||'';it.tf=g[6]?parseInt(g[6],10):null;it.dir=(g[7]||'').trim()}
    else{
      g=acc.match(/^(\D*?)(\d+)([A-Z]*)\/([\d.]+)㎡\s*,?\s*(?:([^\s\/,]+)\/(\d+)층)?\s*,?\s*(.*)$/);
      if(g){it.ptype=g[1];it.sup=parseInt(g[2],10);it.type=g[3]||'';it.ex=parseFloat(g[4]);it.fl=g[5]||'';it.tf=g[6]?parseInt(g[6],10):null;it.dir=(g[7]||'').replace(/^,\s*/,'').trim()}
    }
    var end=ix+1<anchors.length?heads[ix+1]:L.length;
    var desc=[], afterDate=false, wantOffice=false;
    for(var j=k+1;j<end;j++){
      var t=L[j];
      if(/^(로그인|네이버파이낸셜|전체서비스)/.test(t)) break;
      if(isSkip(t)) continue;
      var dm=t.match(DATE_RE);
      if(dm){var d=normDate(dm[2]);if(dm[1]==='확인매물')it.conf=d;else it.reg=d;if(dm[3])it.n=parseInt(dm[3],10);afterDate=true;wantOffice=false;continue}
      if(/^중개사\s*\d+곳/.test(t)){it.n=parseInt(t.match(/(\d+)곳/)[1],10);continue}
      if(/\S\s*제공$/.test(t)&&!it.src){it.src=t.replace(/\s*제공$/,'');wantOffice=true;continue}
      if(wantOffice&&!it.office){it.office=t;wantOffice=false;continue}
      if(afterDate&&!it.office&&!it.n){it.office=t;continue}
      if(afterDate&&it.office&&!it.src){it.src=t;continue}
      desc.push(t.replace(/^["“”]+|["“”]+$/g,''));
    }
    if(desc.length) it.memo=desc.join(' ').slice(0,160);
    out.push(it);
  });
  var cnt={};out.forEach(function(x){if(x.cx)cnt[x.cx]=(cnt[x.cx]||0)+1});
  var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0]||'이름 모를 단지';
  out.forEach(function(x){if(!x.cx)x.cx=top});
  return {items:out,screenCount:screenCount};
}

/* ===== 계산 ===== */
function fmt(v){
  if(v==null||isNaN(v)) return '—';
  var e=Math.floor(v/10000), r=v%10000;
  if(e&&r) return e+'억 '+r.toLocaleString();
  if(e) return e+'억';
  return r.toLocaleString();
}
function fmtRange(it){
  if(it.dep!=null) return fmt(it.dep)+' / '+it.rent.toLocaleString()+(it.dep2!=null?' ~ '+fmt(it.dep2)+' / '+it.rent2.toLocaleString():'');
  return it.lo===it.hi?fmt(it.lo):fmt(it.lo)+' ~ '+fmt(it.hi);
}
function median(a){var s=a.slice().sort(function(x,y){return x-y});var n=s.length;if(!n)return null;var m=n>>1;return n%2?s[m]:Math.round((s[m-1]+s[m])/2)}
function areaKey(it,split){var b=it.ex!=null?Math.floor(it.ex):'?';return split?b+'|'+(it.sup||'')+(it.type||''):String(b)}
function itemKey(it){return [it.dong,it.fl,it.tf,it.ex,it.lo,it.rent==null?'':it.rent].join('|')}
function compare(rec,prev){
  var res={isNew:new Set(),gone:[]};
  if(!prev) return res;
  var pc={};prev.items.forEach(function(x){var k=itemKey(x);pc[k]=(pc[k]||0)+1});
  var rc={};
  rec.items.forEach(function(x,i){var k=itemKey(x);if(pc[k]>0)pc[k]--;else res.isNew.add(i);rc[k]=(rc[k]||0)+1});
  prev.items.forEach(function(x){var k=itemKey(x);if(rc[k]>0)rc[k]--;else res.gone.push(x)});
  return res;
}
function dupSet(rec){var c={};rec.items.forEach(function(x){var k=itemKey(x);c[k]=(c[k]||0)+1});var s=new Set();rec.items.forEach(function(x,i){if(c[itemKey(x)]>1)s.add(i)});return s}

/* ===== 저장(이 PC의 크롬 안) ===== */
var db={v:1,complexes:{}};
var idb=null;

function rmGet(params){
  if(!db.hogaKey){var e0=new Error('리얼맵 비밀번호를 먼저 넣어 주세요.');e0.code='nokey';return Promise.reject(e0)}
  var u=RM_API+'?'+Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&');
  return fetch(u,{headers:{'X-Hoga-Key':db.hogaKey}}).then(function(r){return r.json()}).then(function(j){if(!j.ok){var e=new Error(j.message||'오류');e.code=j.error;throw e}return j});
}

function shortDate(s){if(!s)return'';var p=s.split('.');return p.length>=3?p[1]+'.'+p[2]:s}
function pyeong(sup){return sup?Math.round(sup/3.3058):null}
function band(x){var f=x.fl||'';if(/^저/.test(f))return'저';if(/^중/.test(f))return'중';if(/^고/.test(f))return'고';var n=parseInt(f,10),t=x.tf;if(isNaN(n)||!t)return'';var third=t/3;return n<=Math.max(3,Math.round(third))?'저':(n>t-third?'고':'중')}

function features(memos){
  var free=memos.filter(function(m){return !/^\d+년이내/.test(m)});
  if(free.length){var m=free[0].replace(/([가-힣a-zA-Z0-9])[uU](?=[가-힣0-9])/g,'$1 · ').replace(/\s+/g,' ').trim();return m.length>44?m.slice(0,43)+'…':m}
  var t=memos.join(' '),got=[];
  KEYS.forEach(function(k){if(t.indexOf(k)>=0&&!got.some(function(g){return g.indexOf(k)>=0}))got.push(k)});
  return got.map(function(g){return g.replace('융자금없는','융자금 없음').replace('융자금적은','융자금 적음')}).join(' · ');
}
function dedupe(items){
  var m={},out=[];
  items.forEach(function(x){
    var k=itemKey(x),r=m[k];
    if(!r){r=m[k]=Object.assign({},x,{_o:[],_m:[],_d:[],cnt:0});out.push(r)}
    r.cnt++;
    if(x.n)r.n=Math.max(r.n||0,x.n);
    if(x.office&&r._o.indexOf(x.office)<0)r._o.push(x.office);
    if(x.memo)r._m.push(x.memo);
    var d=x.conf||x.reg;if(d)r._d.push(d);
    if(x.short)r.short=true;
  });
  out.forEach(function(r){
    if(r._o.length>1&&(r.n||0)<r._o.length)r.n=r._o.length;
    r.office=r._o[0]||'';r.date=r._d.sort().slice(-1)[0]||'';r.feat=features(r._m);
  });
  return out;
}

  if(c.rtErr&&!c.rt)return '<span class="note" style="font-size:12px;color:var(--red)">실거래를 불러오지 못했습니다</span>';

  h+='<div class="scroll"><table class="mx"><thead><tr><th>평형 · 타입</th><th>집 수</th><th>저층</th><th>중층</th><th>고층</th><th>'+(isR?'최저 보증금':'타입 최저')+'</th></tr></thead><tbody>';

function resetView(){S.area=null;S.type=null;S.band=null;S.pb=null;S.filter='all';S.showAll=false}

function doParse(){
  var ta=document.getElementById('paste'),raw=ta?ta.value:'';
  if(!raw.trim()){alert('붙여 넣은 내용이 없습니다.');return}
  var r=parseListings(raw);
  if(!r.items.length){alert('매물을 하나도 읽지 못했습니다. 단지 매물 목록 화면을 처음부터 끝까지 드래그해 복사했는지 확인해 주세요.');return}
  var by={};r.items.forEach(function(x){var k=x.cx+'\u0001'+x.kind;(by[k]=by[k]||[]).push(x)});
  var now=Date.now(),lines=[],firstCx=null,firstKind=null,newCx=[];
  Object.keys(by).forEach(function(k,ix){
    var p=k.split('\u0001'),cx=p[0],kind=p[1],items=by[k];
    if(!db.complexes[cx]){db.complexes[cx]={records:[]};newCx.push(cx)}
    items.forEach(function(x){delete x.cx});
    db.complexes[cx].records.push({id:now+'-'+ix,kind:kind,at:now,items:items});
    lines.push({cx:cx,t:kind+' '+items.length+'건'});
    if(!firstCx||(cx===firstCx&&kind==='매매')){firstCx=cx;firstKind=kind}
  });
  save();
  var gx={};lines.forEach(function(l){(gx[l.cx]=gx[l.cx]||[]).push(l.t)});
  var h='저장했습니다: <b>'+Object.keys(gx).map(function(c){return esc(c)+' — '+gx[c].join(' · ')}).join(' / ')+'</b>',t='ok';
  if(r.screenCount!=null&&r.screenCount!==r.items.length){t='warn';h+='<br>화면에는 '+r.screenCount+'개로 나와 있는데 '+r.items.length+'건을 읽었습니다. 목록을 끝까지 펼친 뒤 복사했는지 확인해 주세요.'}
  S.msg={t:t,h:h};S.view='one';S.cx=firstCx;S.kind=KINDS.indexOf(firstKind)>=0?firstKind:'매매';S.rec=null;resetView();
  var d=document.getElementById('dlg');if(d.open)d.close();
  render();
  setTimeout(function(){if(S.msg&&S.msg.t==='ok'){S.msg=null;if(S.view==='one')renderMain()}},6000);
  if(newCx.length){locQueue=newCx.slice(1);locDialog(newCx[0])}
}

  h+='<div class="row"><span class="note" style="font-size:12px">'+(locQueue.length?'남은 새 단지 '+locQueue.length+'곳 · ':'')+'<button class="link" data-act="keyask2">리얼맵 비밀번호 '+(db.hogaKey?'바꾸기':'넣기')+'</button></span><div style="display:flex;gap:8px"><button class="btn" data-act="locskip">나중에</button><button class="big" data-act="locsave">저장</button></div></div>';
  var d=document.getElementById('dlg');d.innerHTML=h;if(!d.open)d.showModal();

function locFind(){
  LD.gu=document.getElementById('lgu').value;LD.q=document.getElementById('lq').value.trim();LD.umd=document.getElementById('ldong').value.trim();
  var lawd=lawdOf(LD.gu);if(!lawd){LD.err='구를 먼저 골라 주세요.';drawLoc();return}
  LD.err='';var b=document.querySelector('[data-act=locfind]');b.disabled=true;b.textContent='찾는 중…';
  rmGet({op:'find',lawd:lawd,q:LD.q||LD.n}).then(function(j){LD.cands=j.items;
    if(!LD.picked.length&&j.items.length){var nn=LD.q.replace(/\s/g,'');var ex=j.items.filter(function(x){return x.name.replace(/\s/g,'')===nn});LD.picked=(ex.length?ex:[j.items[0]]).map(function(x){return x.name})}
    var f=j.items.filter(function(x){return LD.picked.indexOf(x.name)>=0})[0];if(f&&!LD.umd)LD.umd=f.umd;
  }).then(drawLoc,function(e){if(e.code==='badkey'||e.code==='nokey'){keyDialog(e.code==='badkey'?'비밀번호가 맞지 않습니다. 다시 넣어 주세요.':'',function(){locDialog2()});return}LD.err=e.code==='nokey'?'':'리얼맵에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요. ('+(e.message||e)+')';drawLoc()});
}

  download('단지비교_'+K+'_'+ymd()+'.csv','﻿'+lines.join('\r\n'),'text/csv;charset=utf-8');
}
function doBackup(){var c=Object.assign({},db);delete c.hogaKey;download('호가장부_백업_'+ymd()+'.json',JSON.stringify(c),'application/json')}
function doRestore(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);if(!d||!d.complexes)throw 0;var added=0;
      Object.keys(d.complexes).forEach(function(n){
        var src=d.complexes[n];if(!db.complexes[n])db.complexes[n]={records:[]};var dst=db.complexes[n];
        ['info','gu','dong','lawd','rtNames','rtUmd'].forEach(function(k){if(src[k]&&!dst[k])dst[k]=src[k]});
        var ids=new Set(dst.records.map(function(r){return r.id}));
        (src.records||[]).forEach(function(r){if(!ids.has(r.id)){dst.records.push(r);added++}});
      });
      save();S.msg={t:'ok',h:'백업을 불러왔습니다. 새로 더해진 기록 '+added+'개 (이미 있던 기록은 그대로 둡니다).'};
      if(!S.cx)S.cx=names()[0]||null;render();
    }catch(e){alert('백업 파일을 읽지 못했습니다. 이 프로그램에서 [백업 저장]으로 만든 파일이 맞는지 확인해 주세요.')}
  };
  fr.readAsText(file);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,v=b.dataset.v,dlg=document.getElementById('dlg');
  if(a==='cx'){S.view='one';S.cx=v;S.rec=null;S.msg=null;resetView();var ks=KINDS.filter(function(k){return recsOf(v,k).length});if(ks.length&&!recsOf(v,S.kind).length)S.kind=ks[0];render()}
  else if(a==='chk'){var i=SEL.indexOf(v);if(b.checked&&i<0)SEL.push(v);if(!b.checked&&i>=0)SEL.splice(i,1);saveSel();renderTop();renderSide();if(S.view==='cmp'){renderSub();renderCmp()}}
  else if(a==='compare'){S.view='cmp';render()}
  else if(a==='view'){S.view=v;render()}
  else if(a==='onlysel'){S.onlySel=v==='1';renderSide()}
  else if(a==='ckind'){S.ckind=v;renderSub();renderCmp()}
  else if(a==='cband'){S.cband=v;renderSub();renderCmp()}
  else if(a==='cmpExcel')cmpExcel();
  else if(a==='kind'){S.kind=v;S.rec=null;resetView();renderSub();renderMain()}
  else if(a==='cell'){S.area=b.dataset.a;S.type=b.dataset.t||null;S.band=b.dataset.b||null;S.pb=null;S.showAll=false;renderMain()}
  else if(a==='area'){S.area=v;S.type=null;S.band=null;S.pb=null;S.showAll=false;renderMain()}
  else if(a==='type'){S.type=v||null;S.pb=null;S.showAll=false;renderMain()}
  else if(a==='band'){S.band=v||null;S.pb=null;S.showAll=false;renderMain()}
  else if(a==='pb'){var n=+v;S.pb=S.pb===n?null:n;S.showAll=false;renderMain()}
  else if(a==='sort'){if(S.sort===v)S.dir=-S.dir;else{S.sort=v;S.dir=1}renderMain()}
  else if(a==='filter'){S.filter=v;S.showAll=false;renderMain()}
  else if(a==='more'){S.showAll=!S.showAll;renderMain()}
  else if(a==='broker'){S.broker=!S.broker;S.filter='all';render()}
  else if(a==='parse')doParse();
  else if(a==='openPaste')openPaste();
  else if(a==='history')openHistory();
  else if(a==='latest'){S.rec=null;resetView();renderMain()}
  else if(a==='info'){locQueue=[];locDialog(S.cx)}
  else if(a==='tog'){folded[v]=!folded[v];renderSide()}
  else if(a==='locfind')locFind();
  else if(a==='keyask')keyDialog('',function(){var d=document.getElementById('dlg');if(d.open)d.close();render()});
  else if(a==='keyask2'){LD.q=document.getElementById('lq').value;LD.gu=document.getElementById('lgu').value;LD.umd=document.getElementById('ldong').value;keyDialog('',function(){drawLoc()})}
  else if(a==='keysave'){var kv=document.getElementById('hkey').value.trim();if(!kv){alert('비밀번호를 넣어 주세요.');return}db.hogaKey=kv;names().forEach(function(n){var c=db.complexes[n];if(c.rtErr==='key')c.rtErr=''});save();var af=KD.after;KD.after=null;if(af)af();else{dlg.close();render()}}
  else if(a==='keyno'){KD.after=null;dlg.close();render()}
  else if(a==='lcand'){var x=LD.cands[+v],k=LD.picked.indexOf(x.name);if(b.checked&&k<0)LD.picked.push(x.name);if(!b.checked&&k>=0)LD.picked.splice(k,1);if(b.checked&&!document.getElementById('ldong').value)document.getElementById('ldong').value=x.umd}
  else if(a==='locsave')locSave();
  else if(a==='locskip')nextLoc();
  else if(a==='viewrec'){var r=db.complexes[S.cx].records.filter(function(x){return x.id===v})[0];S.view='one';S.kind=r.kind;S.rec=v;resetView();dlg.close();render()}
  else if(a==='delrec'){if(confirm('이 기록을 지울까요? 지우면 되돌릴 수 없습니다.')){var c=db.complexes[S.cx];c.records=c.records.filter(function(x){return x.id!==v});delete cache[v];if(S.rec===v)S.rec=null;resetView();if(!c.records.length){delete db.complexes[S.cx];SEL=SEL.filter(function(n){return n!==S.cx});db.sel=SEL.slice();S.cx=names()[0]||null;dlg.close()}save();render();if(S.cx&&dlg.open)openHistory()}}
  else if(a==='delcx'){if(confirm(S.cx+' 단지의 기록을 모두 지울까요? 지우면 되돌릴 수 없습니다.')){var gone=S.cx;delete db.complexes[gone];SEL=SEL.filter(function(n){return n!==gone});db.sel=SEL.slice();S.cx=names()[0]||null;S.rec=null;resetView();save();dlg.close();render()}}
  else if(a==='close')dlg.close();
  else if(a==='excel')doExcel();
  else if(a==='backup')doBackup();
  else if(a==='restore')document.getElementById('restoreFile').click();
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('td[data-act],th[data-act]')){e.preventDefault();e.target.click()}});
document.getElementById('restoreFile').onchange=function(){if(this.files[0])doRestore(this.files[0]);this.value=''};
openDB().then(load).then(function(){
  SEL=(db.sel||[]).filter(function(n){return db.complexes[n]});
  var n=names();S.cx=n.length?n.sort(function(a,b){return lastAt(b)-lastAt(a)})[0]:null;
  if(S.cx){var ks=KINDS.filter(function(k){return recsOf(S.cx,k).length});if(ks.length&&ks.indexOf(S.kind)<0)S.kind=ks[0]}
  render();
});
</script>
